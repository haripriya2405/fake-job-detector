# ==============================================================================
# Render Infrastructure Blueprint — SentinelJob AI Backend & PostgreSQL
# ==============================================================================
services:
  # FastAPI ASGI Backend Web Service
  - type: web
    name: sentineljob-backend
    env: docker
    dockerfilePath: docker/backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APPLICATION_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sentineljob-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  # Render PostgreSQL Database
  - name: sentineljob-db
    databaseName: fake_job_detector
    user: sentinel_user
    plan: free
    region: oregon
